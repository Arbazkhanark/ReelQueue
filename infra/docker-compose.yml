name: reelqueue

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reelqueue
      POSTGRES_PASSWORD: reelqueue
      POSTGRES_DB: reelqueue
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelqueue -d reelqueue"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID missing}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY missing}
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  rustfsdata:
